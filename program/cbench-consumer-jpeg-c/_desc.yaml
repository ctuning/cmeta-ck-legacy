    - 'jcparam.c'
    - 'jcphuff.c'
    - 'jcprepct.c'
    - 'jcsample.c'
    - 'jctrans.c'
    - 'jdapimin.c'
    - 'jdapistd.c'
    - 'jdatadst.c'
    - 'jdatasrc.c'
    - 'jdcoefct.c'
    - 'jdcolor.c'
    - 'jddctmgr.c'
    - 'jdhuff.c'
    - 'jdinput.c'
    - 'jdmainct.c'
    - 'jdmarker.c'
    - 'jdmaster.c'
    - 'jdmerge.c'
    - 'jdphuff.c'
    - 'jdpostct.c'
    - 'jdsample.c'
    - 'jdtrans.c'
    - 'jerror.c'
    - 'jfdctflt.c'
    - 'jfdctfst.c'
    - 'jfdctint.c'
    - 'jidctflt.c'
    - 'jidctfst.c'
    - 'jidctint.c'
    - 'jidctred.c'
    - 'jmemansi.c'
    - 'jmemmgr.c'
