authors: Grigori Fursin
inherits:
  - template-c-cpu,649899ef3f004e4a
  - template-ck-program,f7fab3bed78041d1       # the hooks of converted programs (cmeta-aops)

# Converted from the Collective Knowledge (CK) format by task::import-ck; see README.md.
origin:
  suite: 'PolyBench/GPU 1.0 CUDA (Ohio State University, University of Delaware), CK version'
  ck_repo: 'ctuning/ck-ml'
  ck_entry: 'program:polybench-cuda-covar'
  ck_uid: '8d45f1bc018e6aee'
  ck_created: '2012-07-08'
  converted: '2026-11-16 by task::import-ck'
  # What was changed in the CK sources, and why
  patches:
    - 'covariance.cu: from CUDA 13 on (CUDART_VERSION >= 13000) cudaDeviceSynchronize() for cudaThreadSynchronize() and the compute mode from cudaDeviceGetAttribute - CUDA 13 removed both; CUDA 11 and 12 keep the original calls'
    - 'covariance.cu: the arrays of main() are allocated zeroed (calloc): kernels that add into an array main() sends to the GPU uninitialized (3mm, atax, bicg, gesummv) gave results that depended on what the memory held'
    - 'covariance.cu: the CPU reference of main() that CK commented out is compiled with CK_CPU_CHECK (defined unless --compile.check=no), so that "Non-Matching CPU-GPU Outputs" compares the GPU''s result with the CPU''s'

# The licence of the sources (the cMeta description and hooks: Apache-2.0)
license:
  name: 'not stated by its authors: copyright 2012 University of Delaware, citation requested (PolyBench/GPU 1.0; its CUDA codes derive from PolyBench 2.0, GPLv2)'
  file: 'src/NOTICE.txt'

###################################################################################################
local_vars:
  lang: cuda

  src_file_names:
    - 'covariance.cu'

  target_file_name: 'covar'

  output_files:
    - 'tmp-ck-timer.json'

  result_files:
    stats-xopenme: tmp-ck-timer.json

  run_time_env:
    CMETA_TARGETS: '{{global.target.cmeta_targets}}'
    CT_REPEAT_MAIN: '{{local.params.repeat|1}}'

  # Hooks of template-ck-program (customize_ck_run): standard output and error into files, as CK did
  ck_redirect_stdio: True

  # The CPU reference of main(), a comment in the CK version: CK_CPU_CHECK (the hooks), so that
  # "Non-Matching CPU-GPU Outputs" is a check; --compile.check=no leaves it out, as CK did
  ck_cpu_check: True

  # Where CK measured the time goes (hot_functions)
  ck_hot_functions:
    default: ["kernel_2mm"]

###################################################################################################
params:
  compute: cuda
  compile:
    d:
      DATA_TYPE: 'float'
      DIM_THREAD_BLOCK_KERNEL_1_X: '256'
      DIM_THREAD_BLOCK_KERNEL_1_Y: '1'
      DIM_THREAD_BLOCK_KERNEL_2_X: '32'
      DIM_THREAD_BLOCK_KERNEL_2_Y: '8'
      DIM_THREAD_BLOCK_KERNEL_3_X: '256'
      DIM_THREAD_BLOCK_KERNEL_3_Y: '1'
      NI: '512'
      NJ: '512'
      XOPENME:

# nvcc builds for the architecture of the GPU it finds
use:
  nvcc:
    with:
      arch_flags: True

###################################################################################################
updates:
  compile:
    uses:
      - match:
          internal_func: customize2
        append:
          # The run-time libraries (built once per target and cached by task setup)
          - task: setup,a2f9b61079ce4333
            name: lib-polybench,70349e61a532455d
            with:
              static: '{{params.compile.static|$None}}'

          - task: setup,a2f9b61079ce4333
            name: lib-xopenme,c7b96678a7734510
            with:
              static: '{{params.compile.static|$None}}'

          # The CUDA runtime: its library folder on the run-time path (a CUDA of the cMeta cache
          # is not on the system's)
          - task: setup,a2f9b61079ce4333
            name: lib-cuda,ac9daedec465409e

  run:
    uses:
      - match:
          internal_func: customize_run
        append:
          - internal_func: customize_ck_run
            internal_func_from_local_key: selected-program
            internal_func_safe: True

      - match:
          task: setup-run,148f6c1fdb4247df
        update:
          cmd_main: '{{local.ck_redirects|}}'
