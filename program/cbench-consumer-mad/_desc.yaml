    - 'field.c'
    - 'file.c'
    - 'filter.c'
    - 'fixed.c'
    - 'frame.c'
    - 'frame2.c'
    - 'frametype.c'
    - 'genre.c'
    - 'huffman.c'
    - 'latin1.c'
    - 'layer12.c'
    - 'layer3.c'
    - 'madplay.c'
    - 'parse.c'
