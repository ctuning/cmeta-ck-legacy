# Converted from the Collective Knowledge (CK) format by task::import-ck; see README.md.
origin:
  suite: 'cBench (MiBench-based, cTuning)'
  ck_repo: 'ctuning/ck-ml'
  ck_entry: 'program:cbench-consumer-mad'
  ck_uid: 'f258a1b1479593a5'
  ck_created: '2012-09-23'
  converted: '2026-11-15 by task::import-ck'
  # What was changed in the CK sources, and why
  patches:
    - 'config.h: snprintf and vsnprintf mapped to _snprintf and _vsnprintf only for MSVC before 2015, which had no C99 ones (the macros are an error with the Universal CRT)'
    - 'audio_esd.c: without <unistd.h>, which nothing there uses: config.h leaves HAVE_UNISTD_H unset, so global.h makes isatty() a macro that breaks the header (Linux) or the header is missing (Windows)'

# The licence of the sources (the cMeta description and hooks: Apache-2.0)
license:
  name: 'GNU GPL v2 or later (MAD, Robert Leslie)'
  spdx: 'GPL-2.0-or-later'
  file: 'src/LICENSE'

###################################################################################################
