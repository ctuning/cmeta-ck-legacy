authors: Grigori Fursin
inherits:
  - template-c-cpu,649899ef3f004e4a
  - template-ck-program,f7fab3bed78041d1       # the hooks of converted programs (cmeta-aops)

# Converted from the Collective Knowledge (CK) format by task::import-ck; see README.md.
origin:
  suite: 'cBench (MiBench-based, cTuning)'
  ck_repo: 'ctuning/ck-ml'
  ck_entry: 'program:cbench-security-blowfish'
  ck_uid: 'b2fbb2cfee7a30c7'
  ck_created: '2012-09-23'
  converted: '2026-11-16 by task::import-ck'
  # What was changed in the CK sources, and why
  patches:
    - 'bf.c: the input and output files in binary mode ("rb", "wb"; Windows changed the bytes in text mode)'
    - 'bf.c: the xOpenME timer spans the whole loop over the blocks, and its state is written and freed once after it (before, xopenme_finish() ran after every 40-byte block: a double free from the second block)'

# The licence of the sources (the cMeta description and hooks: Apache-2.0)
license:
  name: 'SSLeay licence (Eric Young)'
  spdx: 'SSLeay-standalone'
  file: 'src/LICENSE'

# The reference outputs (cx program run ... --check_output)
output_check:
  files:
    - 'tmp-output.tmp'
    - 'tmp-output2.tmp'

###################################################################################################
local_vars:
  lang: c

  src_file_names:
    - 'bf.c'
    - 'bf_cbc.c'
    - 'bf_cfb64.c'
    - 'bf_ecb.c'
    - 'bf_enc.c'
    - 'bf_ofb64.c'
    - 'bf_skey.c'

  target_file_name: 'security-blowfish'

  input_files:
    data: '{{local.dataset.path}}'

  output_files:
    - 'tmp-ck-timer.json'

  result_files:
    stats-xopenme: tmp-ck-timer.json

  run_time_env:
    CMETA_TARGETS: '{{global.target.cmeta_targets}}'
    CT_REPEAT_MAIN: '{{local.params.repeat|1}}'

  # Hooks of template-ck-program (customize_ck_run): standard output and error into files, as CK did
  ck_redirect_stdio: True

  # Where CK measured the time goes (hot_functions)
  ck_hot_functions:
    decode: ["BF_encrypt", "BF_cfb64_encrypt"]
    encode: ["BF_encrypt", "BF_cfb64_encrypt"]

###################################################################################################
params:
  compile:
    d:
      XOPENME:

params_os:
  linux:
    compile:
      lib_names:
        - m

###################################################################################################
updates:
  compile:
    uses:
      - match:
          internal_func: customize2
        append:
          # The run-time libraries (built once per target and cached by task setup)
          - task: setup,a2f9b61079ce4333
            name: lib-xopenme,c7b96678a7734510
            with:
              static: '{{params.compile.static|$None}}'

          # Android: the libraries of the NDK sysroot
          - task: setup,a2f9b61079ce4333
            if: '"android-cpu" in {{global.target.compute|$[]}}'
            name: lib-sysroot-android,cdc22b7617f54f2c
            with:
              static: '{{local.params.compile.static|$None}}'
              lib_names:
                - dl
                - m
                - z
              dynamic_libs:
                - c++_shared

  run:
    uses:
      - match:
          internal_func: customize_run
        append:
          - task: dataset,30e20c7489f14f84
            dataset_tags: benc,crypto
            name: '{{params.dataset|$None}}'
            filename: '{{params.dataset_file|$None}}'

          - internal_func: customize_ck_run
            internal_func_from_local_key: selected-program
            internal_func_safe: True

###################################################################################################
# The commands of the CK program (--cmd=<name>)
updates_cmd:
  decode:
    run:
      uses:
        - match:
            task: dataset,30e20c7489f14f84
          update:
            dataset_tags: benc,crypto
            filename: '{{params.dataset_file|$None}}'
        - match:
            task: setup-run,148f6c1fdb4247df
          update:
            cmd_main: 'd {qinput_files.data} tmp-output.tmp 1234567890abcdeffedcba0987654321 {{local.ck_redirects|}}'
    local_vars:
      +output_files:
        - 'tmp-output.tmp'

  encode:
    run:
      uses:
        - match:
            task: dataset,30e20c7489f14f84
          update:
            dataset_tags: enc,crypto
            filename: '{{params.dataset_file|$None}}'
        - match:
            task: setup-run,148f6c1fdb4247df
          update:
            cmd_main: 'e {qinput_files.data} tmp-output.tmp 1234567890abcdeffedcba0987654321 {{local.ck_redirects|}}'
    local_vars:
      +output_files:
        - 'tmp-output.tmp'
