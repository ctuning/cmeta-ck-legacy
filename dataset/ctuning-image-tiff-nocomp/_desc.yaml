authors: Grigori Fursin
description: 'cBench inputs image-tiff-nocomp (cTuning MiDataSets): 30 inputs (image-tiff-0001-nocomp ... image-tiff-0030-nocomp), image-tiff-0001-nocomp with its files in this repository, the others from the Hugging Face dataset ctuning/cTuning-MiDataSets (its folder image-tiff-nocomp), downloaded once on demand by task::get-hf-dataset (access on request as the README says, then hf auth login once on the machine).'

# The set the inputs come from: a folder of a Hugging Face dataset, downloaded once into the cache by
# task::get-hf-dataset (access on request as the README says, then "cx tool run hf -- auth login" once on the
# machine): a folder per input. The inputs in files/ of this artifact are taken from there
uses:
  - task: get-hf-dataset,9865f4ce243f4984
    repo: 'ctuning/cTuning-MiDataSets'
    filename: 'image-tiff-nocomp/*'
result_from_ctx: '{{global.get-hf-dataset}}'
sub_datasets_folder: 'image-tiff-nocomp'

