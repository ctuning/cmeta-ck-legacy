authors: Grigori Fursin
description: 'cBench inputs cdataset-patricia (cTuning MiDataSets): 20 inputs (cdataset-patricia-0001 ... cdataset-patricia-0020), cdataset-patricia-0001 with its files in this repository, the others from the Hugging Face dataset ctuning/cTuning-MiDataSets (its folder cdataset-patricia), downloaded once on demand by task::get-hf-dataset (access on request as the README says, then hf auth login once on the machine).'

# The set the inputs come from: a folder of a Hugging Face dataset, downloaded once into the cache by
# task::get-hf-dataset (access on request as the README says, then "cx tool run hf -- auth login" once on the
# machine): a folder per input. The inputs in files/ of this artifact are taken from there
uses:
  - task: get-hf-dataset,9865f4ce243f4984
    repo: 'ctuning/cTuning-MiDataSets'
    filename: 'cdataset-patricia/*'
result_from_ctx: '{{global.get-hf-dataset}}'
sub_datasets_folder: 'cdataset-patricia'

# The inputs (sub-datasets) in order, the first is the default - cx program run <program> cpu --dataset=ctuning-cdataset-patricia/<input>:
# the files in the order a program takes them (the first is the main one), the size in bytes, the input's own tags,
# the number it stands for (CK: run_cmd_main.dataset_number), its CK entry
sub_datasets:
