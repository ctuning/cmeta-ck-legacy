authors: Grigori Fursin
description: 'CK paper input image-jpg-fgg-office-night-gray (the office webcam snapshots of the CK paper repository), from the capsule 20261115.ck-office-snapshots.datasets.tar.gz, downloaded on demand by task::get-ctuning-dataset.'

# The files come from a capsule of the office webcam snapshots of the CK paper repository, unpacked once into the cache
uses:
