authors: Grigori Fursin
description: 'cBench input pcm-0017 (cTuning MiDataSets), from the capsule 20261115.ctuning-midatasets.pcm.tar.gz, downloaded on demand by task::get-ctuning-dataset.'

# The files come from a capsule of the cTuning MiDataSets, unpacked once into the cache
uses:
