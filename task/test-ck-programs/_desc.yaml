authors: Grigori Fursin
description: Run every command of the converted CK programs on one target and compare the outputs of several targets.
cache: false
store_global: false

# The programs and the repository they are taken from
default_programs: cbench-*,polybench-cpu-*
default_repo: cmeta-ck-legacy

# Files of a build folder that are not outputs to compare (times change from run to run)
not_compared:
  - tmp-ck-timer.json

# Outputs that hold something of the host or of the moment (a path, a time): named by the
# comparison, not compared. Key: "<program>" or "<program> <command>"; value: {file: why}.
host_dependent:
  cbench-consumer-lame:
    tmp-output2.tmp: progress and times on standard error
  cbench-consumer-mad:
    tmp-output2.tmp: progress and times on standard error
  cbench-consumer-tiff2bw:
    tmp-output.tmp: the TIFF ImageDescription holds the path of the input file
  cbench-consumer-tiff2median:
    tmp-output.tmp: the TIFF ImageDescription holds the path of the input file
  cbench-telecom-crc32:
    tmp-output1.tmp: the path of the input file is printed
  cbench-security-pgp encode:
    tmp-output.tmp: the signature holds the time it was made
  # PolyBench/GPU: standard output names the GPU (and holds the count of the check, see checks)
  polybench-cuda-*:
    tmp-output1.tmp: the GPU's name and the count of the check against the CPU
  polybench-opencl-*:
    tmp-output1.tmp: the OpenCL platforms and device, and the count of the check against the CPU

# What a run must print: in a file of its build folder, the first group of the regular expression must equal
# expect (every match). PolyBench/GPU: the converted programs compute the CPU reference that CK commented out
# (CK_CPU_CHECK) and count the GPU's results that differ from it beyond the threshold of the source. Left out
# when the runs are built without it (--extra=--compile.check=no).
checks:
  polybench-cuda-*:
    file: tmp-output1.tmp
    regex: 'Non-Matching CPU-GPU Outputs Beyond Error Threshold of [0-9.]+ Percent: (\d+)'
    expect: '0'
    what: GPU results that differ from the CPU's
  polybench-opencl-*:
    file: tmp-output1.tmp
    regex: 'Non-Matching CPU-GPU Outputs Beyond Error Threshold of [0-9.]+ Percent: (\d+)'
    expect: '0'
    what: GPU results that differ from the CPU's
