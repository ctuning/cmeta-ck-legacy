authors: Grigori Fursin
description: Extract the 55 original MILEPOST GCC static features from C89 source.
cache: false
store_global: false
params_map:
  source-file: source_file
  output-file: output_file
  runtime-root: runtime_root

# Where the runtime comes from: a folder or a URL with {name} for each capsule file
# (20261114.*.linux-amd64.tar.gz, checked against the SHA-256 in src/milepost.py).
# The archive record: https://doi.org/10.5281/zenodo.24246695 (published 2026-11-15).
default_capsules: https://zenodo.org/records/24246695/files/{name}?download=1

# The default way on every machine: a Linux container (docker or podman) from this image,
# with the prepared runtime kept in this engine volume (one per capsule set).
container_engine: docker
container_image: python:3.12-slim
container_volume: cmeta-milepost-legacy-20261114

connections:
  - note,869929895d424d5c::20261115.milepost-gcc-test-via-cmeta,3eb2e47d7c63420a
